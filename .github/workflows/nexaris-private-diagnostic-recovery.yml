name: Nexaris private diagnostic recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexaris-private-diagnostic-recovery.yml

permissions:
  contents: read

jobs:
  recover-private-diagnostics:
    if: github.actor == 'SeanEmcee'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.NEXARIS_PRIVATE_OUTPUT_TOKEN || secrets.NEXARIS_UPSTREAM_GITHUB_TOKEN }}
    steps:
      - name: Retrieve failed-build diagnostic JSON into private runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Missing private output token."; exit 1; }
          curl --fail --silent --show-error --location --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/SeanEmcee/Nexaris/releases/assets/764837610" \
            -o /tmp/nexaris-diagnostics.json
          python3 - <<'PY'
          import json
          path = "/tmp/nexaris-diagnostics.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          if data.get("name") == "Nexaris-native-diagnostics.json" and "issues" not in data:
              raise SystemExit("GitHub returned asset METADATA instead of diagnostic contents; cannot diagnose yet.")
          if "issues" not in data:
              raise SystemExit("Downloaded JSON is not the expected Nexaris diagnostic report.")
          issue_list = data.get("issues", [])
          errors = [i for i in issue_list if i.get("severity") == "error"]
          out = [
              "## Private diagnostic extraction from Actions run 44382710025",
              "",
              f"Build status: `{data.get('status')}`",
              f"Compiler exit code: `{data.get('build_exit_code')}`",
              f"Errors observed: `{data.get('errors_observed')}`",
              f"Warnings observed: `{data.get('warnings_observed')}`",
              f"Xcode compilation succeeded: `{data.get('xcode_compilation_succeeded')}`",
              "",
              "### Recorded errors (sanitized by original summarizer)",
          ]
          for i in errors[-100:]:
              origin = i.get("file", "")
              line = i.get("line")
              location = origin + (":" + str(line) if line else "")
              detail = str(i.get("message", "")).replace("\n"," ").replace("\r"," ")
              out.append("- `" + str(i.get("category", "unknown")) + "` " + location + ": " + detail[:320])
          if not errors:
              out.append("No error records parsed; inspect original private native build log.")
          out.append("")
          out.append("The full compiler log remains in the private draft release; do not publish it.")
          with open("/tmp/nexaris-diagnostics-comment.md", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          PY
      - name: Report diagnostics to PRIVATE Nexaris issue only
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 32 \
            --repo SeanEmcee/Nexaris \
            --body-file /tmp/nexaris-diagnostics-comment.md >/dev/null
          echo "Diagnostic summary posted privately. Nothing uploaded as a public artifact."
