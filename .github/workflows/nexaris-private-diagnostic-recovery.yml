name: Nexaris private diagnostic recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexaris-private-diagnostic-recovery.yml

permissions:
  contents: read

jobs:
  recover-private-diagnostics:
    if: github.actor == 'SeanEmcee'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.NEXARIS_PRIVATE_OUTPUT_TOKEN || secrets.NEXARIS_UPSTREAM_GITHUB_TOKEN }}
    steps:
      - name: Extract precise native Swift errors from private failed build
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Missing private output credential"; exit 1; }
          mkdir -p /tmp/nexaris-private-diagnostics
          gh release download nexaris-actions-44476326661 \
            --repo SeanEmcee/Nexaris \
            --pattern 'Nexaris-native-diagnostics.json' \
            --pattern 'Nexaris-native-build.log' \
            --dir /tmp/nexaris-private-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          folder = Path('/tmp/nexaris-private-diagnostics')
          report = json.loads((folder / 'Nexaris-native-diagnostics.json').read_text())
          errors = [issue for issue in report.get('issues', []) if issue.get('severity') == 'error']
          out = [
              '## Private native compiler diagnostics for public run 44476326661',
              '',
              'Source revision: b43946f4073f1a91703692725eadc749a94e51e3',
              'Exit: ' + str(report.get('build_exit_code')),
              'Errors: ' + str(report.get('errors_observed')),
              'Xcode succeeded: ' + str(report.get('xcode_compilation_succeeded')),
              '',
              '### Parsed compiler errors',
          ]
          for issue in errors[:70]:
              f = Path(str(issue.get('file',''))).name
              line = str(issue.get('line',''))
              detail = str(issue.get('message','')).replace('\n',' ').replace('\r',' ')
              detail = re.sub(r'(?i)(?:bearer\\s+\\S+|(?:token|password|private_key)\\s*[:=]\\s*\\S+)', '[redacted]', detail)
              out.append('- ' + str(issue.get('category','')) + ' ' + f + ':' + line + ' ' + detail[:330])
          if not errors:
              raw = (folder / 'Nexaris-native-build.log').read_text(errors='replace').splitlines()
              matches = [line for line in raw if re.search(r'\\berror:', line)]
              out.append('No parsed errors; raw log error count: ' + str(len(matches)))
              for line in matches[:15]:
                  line = re.sub(r'/Users/[^ ]+', '[private-path]', line)
                  out.append('- ' + line[:300])
          out += ['', 'Full build log and binary artifacts remain PRIVATE.']
          Path('/tmp/nexaris-native-compiler-errors.md').write_text('\n'.join(out)+'\n')
          PY
          gh issue comment 35 --repo SeanEmcee/Nexaris --body-file /tmp/nexaris-native-compiler-errors.md >/dev/null
          echo 'Private native diagnostics published to private Nexaris issue 35 (contents withheld from public log).'
