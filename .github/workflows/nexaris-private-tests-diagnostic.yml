name: Nexaris private source regression diagnostics (tests only)
on:
  push:
    branches: [main]
    paths:
      - '.github/nexaris-private-tests-request.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-tests:
    if: >-
      github.actor == 'SeanEmcee' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.head_commit.message == 'ci: diagnose Nexaris private tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private Nexaris without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: SeanEmcee/Nexaris
          ref: feature/nexaris-unified-app
          token: ${{ secrets.NEXARIS_PRIVATE_SOURCE_TOKEN || secrets.NEXARIS_UPSTREAM_GITHUB_TOKEN }}
          persist-credentials: false
          path: source
      - name: Run full Python source tests and report failure names only
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NEXARIS_PRIVATE_OUTPUT_TOKEN || secrets.NEXARIS_UPSTREAM_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p build
          set +e
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v > build/nexaris-private-tests.log 2>&1
          test_exit=$?
          set -e
          TEST_EXIT="$test_exit" python3 - <<'PY'
          from pathlib import Path
          import os, re
          data = Path("build/nexaris-private-tests.log").read_text(encoding="utf-8", errors="replace")
          failures = re.findall(r"^(?:FAIL|ERROR): (test_[a-z0-9_]+) \((test_[a-z0-9_]+)\.", data, re.M)
          print("PRIVATE TEST RESULT: " + ("PASS" if not int(os.environ["TEST_EXIT"]) else "FAIL"))
          print("Distinct failures/errors: " + str(len(failures)))
          for test, module in failures:
              print(f"FAILED TEST {module}.{test}")
          totals = re.findall(r"^(?:Ran \d+ tests.*|FAILED \(.*\)|OK(?: \(.*\))?)$", data, re.M)
          for entry in totals[-2:]:
              print(entry)
          # Never print tracebacks, assertions, secrets or private source into public logs.
          PY
          python3 - <<'PY'
          import pathlib, re
          data = pathlib.Path("build/nexaris-private-tests.log").read_text(errors="replace")
          out = ["## Test-only regression result", "",
                 "Run: https://github.com/SeanEmcee/Nexaris-public-build/actions/runs/" +
                 __import__("os").environ["GITHUB_RUN_ID"], "",
                 "Exception summaries only; full source and logs remain off the public repository.", ""]
          blocks = re.split(r"\n={30,}\n(?=(?:FAIL|ERROR): )", data)
          for block in blocks:
              head = re.search(r"^(FAIL|ERROR): (test_[A-Za-z0-9_]+) \((test_[A-Za-z0-9_]+)\.", block, re.M)
              if not head:
                  continue
              lines = block.splitlines()
              locs = re.findall(r'File "[^"]+/([^/]+)", line (\d+)', block)
              loc = f"{locs[-1][0]}:{locs[-1][1]}" if locs else "unknown"
              exc = re.search(r"^([A-Za-z_]+(?:Error|Exception)):\s*(.{0,250})$", block, re.M)
              detail = (exc.group(1) if exc else "Exception")
              detail_line = (exc.group(2) if exc else "")
              # No repr(source) or tokens in the issue. Text is truncated before source dumps.
              detail_line = re.sub(r"(['\"]).{55,}", "[omitted]", detail_line)
              out.append(f"- **{head.group(1)}** `{head.group(3)}.{head.group(2)}` at `{loc}`: {detail} {detail_line[:130]}")
          # Include setUpModule/setUpClass/import-time errors that are not
          # named test_* functions; these still fail the suite.
          ordinary = re.findall(r"^(?:FAIL|ERROR): ([^\n]+)$", data, re.M)
          if ordinary:
              out.append("")
              out.append("### All failure/error headings")
              for item in ordinary:
                  out.append("- " + item[:180])
          errors = re.findall(r"^([A-Za-z_]+(?:Error|Exception)): ([^\n]+)$", data, re.M)
          if errors:
              out.append("")
              out.append("### Exception types (values truncated)")
              for name, detail in errors[-12:]:
                  if any(t in detail.lower() for t in ("token=", "password=", "bearer ")):
                      detail = "[redacted]"
                  else:
                      detail = re.sub(r"(['\"]).{55,}", "[omitted]", detail)
                  out.append("- " + name + ": " + detail[:150])
          pathlib.Path("build/rapbox-private-test-summary.md").write_text("\n".join(out) + "\n")
          PY
          if [[ -n "${GH_TOKEN:-}" ]]; then
            gh issue comment 35 --repo SeanEmcee/Nexaris --body-file build/rapbox-private-test-summary.md >/dev/null || echo "::warning::Could not post PRIVATE summary."
          fi
          exit "$test_exit"
